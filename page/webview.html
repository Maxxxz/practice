<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webview切换示例</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        webview {
            width: 100%;
            height: 500px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="switchBtn">切换到Google</button>
    <webview id="myWebview" src="https://www.google.com"></webview>

    <script>
        const switchBtn = document.getElementById('switchBtn');
        const myWebview = document.getElementById('myWebview');
        let isBaidu = true;

        switchBtn.addEventListener('click', () => {
            if (isBaidu) {
                myWebview.src = 'https://www.google.com';
                switchBtn.textContent = '切换到百度';
            } else {
                myWebview.src = 'https://www.baidu.com';
                switchBtn.textContent = '切换到Google';
            }
            isBaidu = !isBaidu;
        });
        myWebview.openDevTools();
    </script>
</body>
</html>
